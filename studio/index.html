<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ResilienceGuard: fire drills for AI agents</title>
<style>
  :root {
    --paper: #f6f4ef; --card: #fffdf9; --ink: #1c1b19; --muted: #6b675f; --line: #e3dfd5;
    --pass: #0f7a3d; --pass-bg: #e7f4ec; --fail: #b42318; --fail-bg: #fbeae8;
    --warn: #a15c07; --warn-bg: #fdf1dc; --na: #8a857b; --na-bg: #efece5; --accent: #5b8c00;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.55 var(--sans); }
  a { color: inherit; }
  header { display: flex; align-items: center; gap: 16px; padding: 18px 32px; border-bottom: 1px solid var(--line); background: var(--card); }
  .brand { font-weight: 700; font-size: 17px; cursor: pointer; }
  .brand small { display: block; font-weight: 400; font-size: 12px; color: var(--muted); }
  nav { margin-left: auto; display: flex; gap: 8px; align-items: center; }
  button, select, input { font: inherit; font-size: 14px; }
  button { white-space: nowrap; cursor: pointer; padding: 9px 14px; border-radius: 9px; border: 1px solid var(--line); background: var(--card); color: var(--ink); }
  button.primary { background: var(--ink); color: var(--card); border-color: var(--ink); font-weight: 600; }
  button.link { border: 0; background: none; padding: 6px 4px; color: var(--muted); text-decoration: underline; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  select, input[type=text], input[type=password] { padding: 9px 11px; border-radius: 9px; border: 1px solid var(--line); background: var(--card); color: var(--ink); }
  main { max-width: 860px; margin: 0 auto; padding: 40px 24px 80px; }
  main.wide { max-width: 1080px; }
  h1 { font-size: 34px; letter-spacing: -0.02em; margin: 0 0 8px; line-height: 1.15; }
  h2 { font-size: 22px; letter-spacing: -0.01em; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 26px; font-size: 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 24px 26px; }
  .card + .card { margin-top: 16px; }
  .label { font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin-bottom: 6px; }
  .muted { color: var(--muted); } .small { font-size: 13px; } .mono { font-family: var(--mono); font-size: 13px; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .grow { flex: 1; min-width: 240px; }
  .chip { border-radius: 999px; padding: 6px 12px; font-size: 13px; background: var(--paper); }
  .check { display: inline-flex; gap: 6px; align-items: center; padding: 5px 10px; border: 1px solid var(--line); border-radius: 999px; font-size: 13px; }
  .found { margin-top: 18px; padding-top: 18px; border-top: 1px solid var(--line); }
  .err { color: var(--fail); font-size: 14px; margin-top: 10px; }
  .grade { font: 700 40px/1 var(--sans); width: 70px; height: 70px; display: grid; place-items: center; border-radius: 14px; flex: none; }
  .grade.A, .grade.B { background: var(--pass-bg); color: var(--pass); }
  .grade.C, .grade.D { background: var(--warn-bg); color: var(--warn); }
  .grade.F { background: var(--fail-bg); color: var(--fail); }
  .scoreline { display: flex; align-items: center; gap: 18px; margin-bottom: 18px; }
  .big { font-size: 18px; font-weight: 600; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); padding: 8px 10px; border-bottom: 1px solid var(--line); }
  td { padding: 12px 10px; border-bottom: 1px solid var(--line); vertical-align: top; font-size: 14px; }
  tr:last-child td { border-bottom: 0; }
  .pill { display: inline-block; font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 999px; white-space: nowrap; }
  .pill.pass { background: var(--pass-bg); color: var(--pass); } .pill.fail { background: var(--fail-bg); color: var(--fail); }
  .pill.na, .pill.wait { background: var(--na-bg); color: var(--na); }
  .why { font-size: 13px; margin-top: 3px; color: var(--muted); word-break: break-word; }
  .tl { display: flex; gap: 3px; margin-top: 6px; flex-wrap: wrap; }
  .tl i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; background: var(--na); }
  .tl i.ok, .tl i.mock { background: var(--pass); } .tl i.injected_error { background: var(--fail); }
  .tl i.upstream_error { background: #6e1009; } .tl i.corrupted { background: var(--warn); }
  .tlrow { display: flex; align-items: center; gap: 8px; margin-top: 3px; } .tlrow span { font-size: 11px; color: var(--muted); width: 56px; }
  .tlrow .tl { margin-top: 0; }
  .dup { border-left: 4px solid var(--fail); } .dup.ok { border-left-color: var(--pass); }
  .dup blockquote { margin: 8px 0 0; font-size: 14px; padding: 10px 12px; background: var(--paper); border-radius: 8px; }
  .actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 22px; padding-top: 20px; border-top: 1px solid var(--line); }
  .spinner { width: 18px; height: 18px; border: 2.5px solid var(--line); border-top-color: var(--ink); border-radius: 50%; animation: spin 0.9s linear infinite; flex: none; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .waitlist { list-style: none; padding: 0; margin: 16px 0 0; }
  .waitlist li { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
  .waitlist li:last-child { border-bottom: 0; }
  details { margin-top: 16px; } details summary { cursor: pointer; font-weight: 600; }
  pre.log { font: 12px/1.45 var(--mono); background: var(--ink); color: #e9e6df; border-radius: 8px; padding: 12px; max-height: 260px; overflow: auto; white-space: pre-wrap; }
  pre.diff { font: 12px/1.5 var(--mono); background: #fbfaf7; border: 1px solid var(--line); border-radius: 8px; padding: 12px; overflow: auto; max-height: 480px; }
  pre.diff .add { background: #e6f4ea; display: block; } pre.diff .del { background: #fbe9e7; display: block; } pre.diff .hunk { color: #3b5bdb; display: block; }
  .loop { display: grid; grid-template-columns: 1fr auto 1fr auto 1fr auto 1fr; align-items: stretch; margin: 6px 0 16px; }
  .stage { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; }
  .stage .k { font: 600 11px/1 var(--mono); color: var(--accent); letter-spacing: 0.08em; text-transform: uppercase; }
  .stage .n { font: 700 28px/1.1 var(--sans); margin: 8px 0 4px; letter-spacing: -0.02em; }
  .stage .n.fail { color: var(--fail); } .stage .n.pass { color: var(--pass); }
  .stage .d { font-size: 12.5px; color: var(--muted); }
  .loop .arr { display: grid; place-items: center; color: var(--muted); font-size: 20px; padding: 0 6px; }
  .verdictline { font-size: 14px; } .verdictline b.f { color: var(--fail); } .verdictline b.p { color: var(--pass); }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 16px; align-items: start; } .grid2 > .card { margin-top: 0; }
  ul.changes { margin: 6px 0 0; padding-left: 18px; } ul.changes li { margin-bottom: 5px; font-size: 14px; }
  @media (max-width: 760px) { .loop, .grid2 { grid-template-columns: 1fr; } .loop .arr { transform: rotate(90deg); } header { padding: 14px 16px; } .brand small, #runPicker { display: none !important; } nav { gap: 6px; } nav button { padding: 7px 9px; font-size: 13px; } .brand { font-size: 15px; } main { padding: 24px 14px 60px; } h1 { font-size: 27px; } }
</style>
</head>
<body>
<header>
  <div class="brand" id="home">ResilienceGuard<small>Fire drills for AI agents on Nebius Token Factory</small></div>
  <nav>
    <select id="runPicker" aria-label="Example result" style="display:none;max-width:300px"></select>
    <button id="navExample">Example result</button>
    <button class="primary" id="navAudit">Audit an agent</button>
  </nav>
</header>
<main id="app"></main>

<script>
const $ = (s) => document.querySelector(s);
const esc = (t) => String(t ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const app = $("#app");
let cfg = {}, fetched = null, poller = null, ticker = null, lastAuditJob = null;

const PLAIN = {baseline: "fails even a normal run", brief_outage: "crashes on a brief outage",
  rate_limit: "crashes on a rate-limit burst", malformed_tool_call: "one garbled tool call is fatal",
  crash_after_action: "repeats its action when rerun", sustained_outage: "doesn't stop during a sustained outage"};
const OUTCOME = {ok: "answered", mock: "answered", injected_error: "fault injected", upstream_error: "provider rejected the request",
  corrupted: "garbled tool call injected", circuit_open: "blocked", killed: "killed"};

const pill = (p) => p === null || p === undefined ? '<span class="pill na">N/A</span>' : p ? '<span class="pill pass">Pass</span>' : '<span class="pill fail">Fail</span>';
const scen = (a, id) => ((a && a.scenarios) || []).find((s) => s.id === id) || {};
const timeline = (run) => !run || !run.timeline ? "" : '<div class="tl">' + run.timeline.map((t) =>
  `<i class="${esc(t.outcome)}" title="${esc(OUTCOME[t.outcome] || t.outcome)}${t.status ? " (" + t.status + ")" : ""}"></i>`).join("") + "</div>";
const pairTl = (x) => { const p = (x.pairs || []).find((q) => q.triggered) || (x.pairs || [])[0];
  return p ? `<div class="tlrow"><span>crash run</span>${timeline(p.crash_run)}</div><div class="tlrow"><span>rerun</span>${timeline(p.rerun)}</div>` : ""; };
const drillTl = (x) => x.runs ? timeline(x.runs[0]) : pairTl(x);
function shortWhy(v) {
  return String(v || "").replace(/:\s*(?:[\w.]+\.)?(\w+(?:Error|Exception)):\s*Error code:\s*(\d+).*$/s, ": $1 ($2)")
    .replace(/:\s*(?:[\w.]+\.)?(\w+(?:Error|Exception)):\s*(.{0,90}).*$/s, ": $1: $2");
}
function actionText(a) {
  try { const args = JSON.parse(a.arguments); return args.summary || args.reason || a.arguments; }
  catch (e) { const m = /"(summary|reason)"\s*:\s*"((?:[^"\\]|\\.)*)/.exec(a.arguments || ""); return m ? m[2] : a.arguments; }
}
const failedIds = (a) => ((a && a.scenarios) || []).filter((s) => s.passed === false).map((s) => s.id);
const fmt = (s) => s < 60 ? `${s}s` : `${Math.floor(s / 60)}m ${String(s % 60).padStart(2, "0")}s`;

async function api(url, body) {
  const r = await fetch(url, body ? {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)} : {});
  let d = {}; try { d = await r.json(); } catch (e) {}
  return [r.ok, d];
}
function stopTimers() { clearInterval(poller); clearInterval(ticker); }
function setWide(w) { app.className = w ? "wide" : ""; }

/* ---------------- 1. Start + 2. Confirm ---------------- */
function viewHome() {
  stopTimers(); setWide(false); $("#runPicker").style.display = "none"; fetched = null;
  const presets = Object.entries(cfg.presets || {});
  app.innerHTML = `
    <h1>Break it. Fix it. Prove it.</h1>
    <p class="sub">Point ResilienceGuard at a real AI agent. It makes Nebius Token Factory misbehave on purpose, shows exactly what breaks,
      and has Nemotron fix the agent, proven by the same drills.</p>
    <div class="card">
      <div class="label">Audit an agent</div>
      <div class="row"><input type="text" id="url" class="grow" placeholder="https://github.com/owner/repo/tree/main/path/to/agent">
        <button class="primary" id="fetchBtn">Fetch</button></div>
      <div class="row small muted" style="margin-top:10px">Or try one from Nebius's cookbook:
        ${presets.map(([k, v]) => `<button class="chip" data-preset="${esc(k)}">${esc(v.title)}</button>`).join("")}</div>
      <div id="found"></div>
    </div>
    <p class="small muted" style="margin-top:14px">Python agents that call Token Factory. The code runs only inside Token Factory Sandboxes microVMs, never on this server.
      <button class="link" id="seeExample">Or see an example result →</button></p>`;
  $("#fetchBtn").onclick = () => doFetch({url: $("#url").value.trim()});
  $("#url").onkeydown = (e) => { if (e.key === "Enter") doFetch({url: $("#url").value.trim()}); };
  document.querySelectorAll("[data-preset]").forEach((b) => b.onclick = () => doFetch({preset: b.dataset.preset}));
  $("#seeExample").onclick = viewExample;
}

async function doFetch(body) {
  const box = $("#found");
  if (!body.preset && !body.url) { box.innerHTML = '<div class="err">Paste a GitHub link first.</div>'; return; }
  box.innerHTML = '<div class="found row"><div class="spinner"></div><span class="muted">Fetching the agent from GitHub…</span></div>';
  const [ok, d] = await api("/api/inspect", body);
  if (!ok) { box.innerHTML = `<div class="err">${esc(d.error || "Could not fetch that agent.")}</div>`; return; }
  fetched = d;
  const tools = d.tools.length ? d.tools.map((t) => `<label class="check"><input type="checkbox" value="${esc(t)}" ${d.suggested_action_tools.includes(t) ? "checked" : ""}><span class="mono">${esc(t)}</span></label>`).join(" ")
    : '<span class="small muted">No tools found, so the crash-and-rerun drill will be skipped.</span>';
  const left = cfg.jobs_left_today;
  box.innerHTML = `<div class="found">
      <div class="big">${esc(d.label)}</div>
      <div class="small muted" style="margin-bottom:14px">${d.files} files${d.has_requirements ? " · its requirements.txt is installed inside the sandbox" : ""}</div>
      <div class="label">Runs with</div>
      <input type="text" id="cmd" class="mono" value="${esc(d.command || "python main.py")}" style="width:100%;margin-bottom:14px">
      <div class="label">Watch these actions for repeats after a crash</div>
      <div class="row">${tools}</div>
      <div class="actions" style="border:0;padding-top:4px">
        <button class="primary" id="runBtn" ${cfg.sandbox_available && left > 0 ? "" : "disabled"}>Run audit</button>
        <span class="small muted">${cfg.sandbox_available ? `${esc(cfg.audit_eta)} · ${left} run${left === 1 ? "" : "s"} left today` : "Live runs need Token Factory Sandboxes on this server."}</span>
      </div><div id="runErr"></div></div>`;
  $("#runBtn").onclick = startAudit;
}

async function startAudit() {
  const tools = [...document.querySelectorAll(".found input[type=checkbox]:checked")].map((i) => i.value);
  const [ok, d] = await api("/api/live", {token: fetched.token, command: $("#cmd").value, action_tools: tools});
  if (!ok) { $("#runErr").innerHTML = `<div class="err">${esc(d.error || "Could not start the audit.")}</div>`; return; }
  viewRunning("audit", d.job, fetched.label);
}

/* ---------------- 3. Running / 5. Fixing ---------------- */
function viewRunning(kind, jobId, label) {
  stopTimers(); setWide(false);
  const audit = kind === "audit";
  const items = audit ? (cfg.drills || []).map((d) => `<li><span><b>${esc(d.name)}</b><br><span class="small muted">${esc(d.simulates)}</span></span><span class="pill wait">waiting</span></li>`).join("")
    : ["Nemotron reads the code, the input files and the audit evidence", "It writes two candidate fixes in parallel",
       "Each fix is re-audited in its own microVM, branched from one checkpoint", "Fixes that still fail go back to Nemotron with their error output"]
      .map((t) => `<li><span>${esc(t)}</span><span class="pill wait">in progress</span></li>`).join("");
  app.innerHTML = `<div class="card">
      <div class="row"><div class="spinner"></div><h2 style="margin:0">${audit ? "Auditing" : "Nemotron is fixing"} ${esc(label)}</h2>
        <span class="muted small" style="margin-left:auto" id="elapsed">0s</span></div>
      <p class="muted" style="margin:10px 0 0">${audit
        ? `Six drills are running inside a Token Factory Sandboxes microVM, ${esc(cfg.audit_eta)}. Results arrive together when it finishes.`
        : `Every candidate is proven by the same drills before it counts, ${esc(cfg.fix_eta)}.`}</p>
      <ul class="waitlist">${items}</ul>
      <div id="runState"></div>
      <details><summary class="small muted">Technical log</summary><pre class="log" id="log">Starting…</pre></details>
    </div>`;
  const t0 = Date.now();
  ticker = setInterval(() => { const e = $("#elapsed"); if (e) e.textContent = fmt(Math.round((Date.now() - t0) / 1000)); }, 1000);
  poller = setInterval(async () => {
    const [ok, j] = await api("/api/jobs/" + jobId);
    if (!ok) return;
    const log = $("#log"); if (log) log.textContent = j.log.join("\n") || "Working…";
    if (j.status === "running") return;
    stopTimers();
    if (j.status === "error") {
      $("#runState").innerHTML = `<div class="err" style="margin-top:14px">${esc(j.error)}</div>
        <div class="actions"><button class="primary" id="back">Back</button></div>`;
      $("#back").onclick = audit ? viewHome : () => openRun(lastAuditJob.run, lastAuditJob.id);
      return;
    }
    if (audit) lastAuditJob = {id: jobId, run: j.run};
    await loadRuns();
    openRun(j.run, audit ? jobId : null);
  }, 2500);
}

/* ---------------- 4. Report + 6. Before/after ---------------- */
async function openRun(file, auditJobId) {
  const [ok, run] = await api("/api/runs/" + encodeURIComponent(file));
  if (!ok) { app.innerHTML = '<div class="card">Could not load that result.</div>'; return; }
  (run.rounds && run.rounds.length) ? viewResult(run) : viewReport(run, auditJobId);
}

function agentLine(run) {
  const m = run.meta || {}, b = run.before;
  const src = m.url ? `<a href="${esc(m.url)}" target="_blank" rel="noopener">${esc(m.source || m.url)}</a>` : esc(m.source || "");
  return `<div class="small muted">${src}${b.agent_model ? ` · runs on <span class="mono">${esc(b.agent_model)}</span>` : ""}${b.sandbox ? " · audited in Token Factory Sandboxes" : ""}</div>`;
}

function drillTable(before, after) {
  return `<table><thead><tr><th>Drill</th><th>${after ? "Before" : "Result"}</th>${after ? "<th>After Nemotron's fix</th>" : ""}</tr></thead><tbody>
    ${(before.scenarios || []).map((b) => { const a = after ? scen(after, b.id) : null;
      return `<tr><td style="width:${after ? 30 : 42}%"><b>${esc(b.name)}</b><div class="why">${esc(b.simulates)}</div></td>
        <td>${pill(b.passed)}<div class="why" title="${esc(b.verdict)}">${esc(shortWhy(b.verdict))}</div>${drillTl(b)}</td>
        ${after ? `<td>${pill(a.passed)}<div class="why" title="${esc(a.verdict)}">${esc(shortWhy(a.verdict))}</div>${drillTl(a)}</td>` : ""}</tr>`; }).join("")}
    </tbody></table>
    <div class="small muted" style="margin-top:8px">Each square is one call to Token Factory: <span style="color:var(--pass)">■</span> answered
      <span style="color:var(--fail)">■</span> fault injected <span style="color:var(--warn)">■</span> garbled tool call <span style="color:#6e1009">■</span> rejected by the provider</div>`;
}

function duplicateCard(audit, after) {
  const s = scen(audit, "crash_after_action");
  const pair = (s.pairs || []).find((p) => p.triggered);
  if (!pair) return "";
  const first = pair.crash_run.actions.find((a) => a.executed), again = pair.rerun.actions[0];
  if (!first) return "";
  const ok = again && !again.executed;
  return `<div class="card dup ${ok ? "ok" : ""}"><div class="label">${after ? "After the fix" : "What happened"}: crash after acting, then rerun</div>
    <div>The agent performed its action, then the provider went down and it crashed:</div><blockquote>${esc(actionText(first))}</blockquote>
    ${!again ? "<p>On the rerun it didn't try the action.</p>" : ok ? `<p style="margin:10px 0 0">On the rerun its own check stopped the repeat:</p><blockquote class="mono">${esc(again.result)}</blockquote>`
      : `<p style="margin:10px 0 0">On the rerun it performed it <b>again</b>, worded differently:</p><blockquote>${esc(actionText(again))}</blockquote>`}</div>`;
}

function viewReport(run, auditJobId) {
  stopTimers(); setWide(false);
  const b = run.before, failed = failedIds(b), canFix = auditJobId && failed.length;
  app.innerHTML = `
    <div class="label">Audit report</div><h2>${esc((run.meta || {}).title || run.agent)}</h2>${agentLine(run)}
    <div class="card" style="margin-top:18px">
      <div class="scoreline"><div class="grade ${esc(b.grade)}">${esc(b.grade)}</div>
        <div><div class="big">${esc(b.score)}/100</div><div class="verdictline">${failed.length
          ? `<b class="f">Found:</b> ${esc(failed.map((id) => PLAIN[id] || id).join("; "))}.` : '<b class="p">No failures found</b> in these drills.'}</div></div></div>
      ${drillTable(b, null)}
      ${canFix ? `<div class="actions"><button class="primary" id="fixBtn" ${cfg.fix_available ? "" : "disabled"}>Let Nemotron fix it</button>
        ${cfg.fix_requires_code ? '<input type="password" id="code" placeholder="access code">' : ""}
        <span class="small muted">${esc(cfg.fix_eta)}</span><button class="link" id="again" style="margin-left:auto">Audit another agent</button></div><div id="fixErr"></div>`
        : `<div class="actions"><button class="primary" id="again">Audit an agent</button>${!auditJobId ? '<span class="small muted">This is a saved audit.</span>' : ""}</div>`}
    </div>
    ${duplicateCard(b, false)}`;
  $("#again").onclick = viewHome;
  if (canFix) $("#fixBtn").onclick = async () => {
    const [ok, d] = await api("/api/fix", {job: auditJobId, code: ($("#code") || {}).value});
    if (!ok) { $("#fixErr").innerHTML = `<div class="err">${esc(d.error || "Could not start the fix.")}</div>`; return; }
    viewRunning("fix", d.job, (run.meta || {}).title || run.agent);
  };
}

function bestCandidate(run) {
  for (const rnd of run.rounds || []) for (const c of rnd) if (run.best && c.round === run.best.round && c.candidate === run.best.candidate) return c;
  return null;
}

function loopBand(run, before, after) {
  const cands = (run.rounds || []).flat(), audited = cands.filter((c) => c.audit);
  const vms = before.sandbox ? 1 + audited.filter((c) => c.sandbox || (c.audit && c.audit.sandbox)).length : 0;
  const drills = (before.scenarios || []).length, nf = failedIds(before).length;
  return `<div class="loop">
    <div class="stage"><div class="k">1 · Break</div><div class="n fail">${nf} failure${nf === 1 ? "" : "s"}</div><div class="d">${drills} drills on real Token Factory traffic. Grade ${esc(before.grade)} (${esc(before.score)}/100).</div></div><div class="arr">→</div>
    <div class="stage"><div class="k">2 · Fix</div><div class="n">${cands.length} fixes</div><div class="d">Written by ${esc((run.model || "").split("/").pop())} over ${(run.rounds || []).length} rounds, repairing its own mistakes.</div></div><div class="arr">→</div>
    <div class="stage"><div class="k">3 · Prove</div><div class="n ${after && after.grade === "A" ? "pass" : ""}">${after ? esc(after.grade) + " " + esc(after.score) : "–"}</div><div class="d">The same ${drills} drills, re-run on the chosen fix.</div></div><div class="arr">→</div>
    <div class="stage"><div class="k">4 · Isolate</div><div class="n">${vms ? vms + " microVMs" : "Local"}</div><div class="d">${vms ? "Every audit in its own Token Factory Sandboxes microVM." : "Run with Sandboxes to isolate every audit."}</div></div></div>`;
}

function treeSvg(run) {
  const rounds = run.rounds || [];
  if (!rounds.length) return "";
  const nCand = Math.max(...rounds.map((r) => Math.max(...r.map((c) => c.candidate))));
  const colW = 210, rowH = 74, x0 = 20, y0 = 34, nodeW = 168, nodeH = 50;
  const W = x0 + colW * (rounds.length + 1), H = y0 + rowH * nCand + 10, rootY = y0 + (rowH * nCand) / 2 - nodeH / 2;
  const isBest = (c) => run.best && c.round === run.best.round && c.candidate === run.best.candidate;
  const color = (c) => !c.audit || c.smoke_failed ? "var(--fail)" : c.audit.grade === "A" ? "var(--pass)" : c.audit.grade === "B" ? "var(--warn)" : "var(--fail)";
  const sb = run.before && run.before.sandbox, pos = {};
  let out = `<svg viewBox="0 0 ${W} ${H}" width="${W}" style="max-width:100%;height:auto" role="img" aria-label="Fix attempts as branches">`;
  out += `<text x="${x0}" y="16" font-size="11" fill="var(--muted)">${sb ? "AGENT CHECKPOINT" : "ORIGINAL AGENT"}</text>`;
  rounds.forEach((r, i) => { out += `<text x="${x0 + colW * (i + 1)}" y="16" font-size="11" fill="var(--muted)">ROUND ${i + 1}${i ? " · REPAIR" : " · FROM EVIDENCE"}</text>`; });
  rounds.forEach((r, i) => r.forEach((c) => { pos[`${c.round}-${c.candidate}`] = {x: x0 + colW * (i + 1), y: y0 + rowH * (c.candidate - 1)}; }));
  rounds.forEach((r, i) => r.forEach((c) => {
    const p = pos[`${c.round}-${c.candidate}`], from = i === 0 ? {x: x0, y: rootY} : (pos[`${c.round - 1}-${c.candidate}`] || {x: x0, y: rootY});
    const x1 = from.x + nodeW, y1 = from.y + nodeH / 2, x2 = p.x, y2 = p.y + nodeH / 2, mx = (x1 + x2) / 2;
    out += `<path d="M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}" fill="none" stroke="${isBest(c) ? "var(--pass)" : "var(--line)"}" stroke-width="${isBest(c) ? 2.5 : 1.5}"/>`;
  }));
  out += `<rect x="${x0}" y="${rootY}" width="${nodeW}" height="${nodeH}" rx="10" fill="var(--paper)" stroke="var(--ink)"/>
    <text x="${x0 + 12}" y="${rootY + 21}" font-size="13" font-weight="600" fill="var(--ink)">${esc(run.before.grade)} ${esc(run.before.score)} · as written</text>
    <text x="${x0 + 12}" y="${rootY + 38}" font-size="11" fill="var(--muted)">${sb ? esc(String(sb.agent_checkpoint).slice(0, 8)) + "…" : "local copy"}</text>`;
  rounds.forEach((r) => r.forEach((c) => {
    const p = pos[`${c.round}-${c.candidate}`], best = isBest(c), vm = c.sandbox || (c.audit && c.audit.sandbox);
    const label = !c.audit ? "rejected" : c.smoke_failed ? "broke normal run" : `${c.audit.grade} ${c.audit.score}`;
    out += `<g><title>${esc((c.changes || []).join(" | ") || c.problem || "")}</title>
      <rect x="${p.x}" y="${p.y}" width="${nodeW}" height="${nodeH}" rx="10" fill="${best ? "var(--pass-bg)" : "var(--card)"}" stroke="${color(c)}" stroke-width="${best ? 2.5 : 1.5}"/>
      <text x="${p.x + 12}" y="${p.y + 21}" font-size="13" font-weight="600" fill="${color(c)}">Fix ${c.candidate} · ${esc(label)}${best ? "  ✓" : ""}</text>
      <text x="${p.x + 12}" y="${p.y + 38}" font-size="11" fill="var(--muted)">${vm && vm.result_image ? "microVM " + esc(String(vm.result_image).slice(0, 8)) + "…" : (c.changed_lines ? c.changed_lines + " lines changed" : "")}</text></g>`;
  }));
  return out + "</svg>";
}

function diffHtml(diff) {
  return (diff || "").split("\n").map((l) => { const c = l.startsWith("@@") ? "hunk" : (l.startsWith("+") && !l.startsWith("+++")) ? "add" : (l.startsWith("-") && !l.startsWith("---")) ? "del" : "";
    return c ? `<span class="${c}">${esc(l)}</span>` : esc(l); }).join("\n");
}

function viewResult(run) {
  stopTimers(); setWide(true);
  const before = run.before, best = bestCandidate(run), after = best && best.audit;
  const groups = []; for (const rnd of run.rounds || []) for (const c of rnd) if (best && c.candidate === best.candidate && c.round <= best.round && (c.changes || []).length) groups.push(c);
  app.innerHTML = `
    <div class="label">Audit and fix</div>
    <h2>${esc((run.meta || {}).title || run.agent)}: ${esc(before.grade)} ${esc(before.score)} → ${after ? esc(after.grade) + " " + esc(after.score) : "no passing fix"}</h2>${agentLine(run)}
    <div style="margin-top:18px">${loopBand(run, before, after)}</div>
    <div class="card">${drillTable(before, after)}</div>
    <div class="grid2">${duplicateCard(before, false)}${after ? duplicateCard(after, true) : ""}</div>
    <details class="card"><summary>Show details: how Nemotron got there, the diff, and what to review</summary>
      <div class="label" style="margin-top:16px">Every fix attempt is a branch${before.sandbox ? " of one Sandboxes checkpoint" : ""}; repairs grow from the attempt before</div>
      <div style="overflow-x:auto">${treeSvg(run)}</div>
      ${groups.map((c) => `<div class="label" style="margin-top:14px">Round ${c.round}: what Nemotron changed</div><ul class="changes">${c.changes.map((x) => `<li>${esc(x)}</li>`).join("")}</ul>`).join("")}
      ${best ? `<div class="label" style="margin-top:14px">The diff: ${esc(best.changed_lines)} lines in ${esc(run.file)}</div><pre class="diff">${diffHtml(best.diff)}</pre>` : ""}
      <div class="label" style="margin-top:14px">Before merging, a person should still check</div>
      <ul class="changes"><li>The duplicate check's key: is it as narrow as it should be? If it covers the whole incident, a later legitimate update is skipped too.</li>
        <li>Exactly-once needs the downstream system: a crash between acting and writing the ledger can still repeat the action.</li>
        <li>Each drill ran once (crash-and-rerun up to three times). A pass is evidence, not a guarantee.</li></ul>
    </details>
    <div class="actions" style="border:0"><button class="primary" id="again">Audit an agent</button></div>`;
  $("#again").onclick = viewHome;
}

/* ---------------- Example results ---------------- */
let runs = [];
async function loadRuns() { const [ok, d] = await api("/api/runs"); runs = ok ? d : []; }
async function viewExample() {
  stopTimers(); await loadRuns();
  const picker = $("#runPicker");
  if (!runs.length) { app.innerHTML = '<div class="card">No saved results yet.</div>'; return; }
  picker.innerHTML = runs.map((r) => `<option value="${esc(r.file)}">${esc(r.agent)} · ${esc(r.before)} → ${esc(r.after)}</option>`).join("");
  picker.style.display = ""; picker.onchange = () => openRun(picker.value, null);
  const first = runs.find((r) => r.after !== "audit only") || runs[0];
  picker.value = first.file; openRun(first.file, null);
}

async function init() {
  const [, c] = await api("/api/config"); cfg = c || {};
  $("#home").onclick = viewHome; $("#navAudit").onclick = viewHome; $("#navExample").onclick = viewExample;
  location.hash === "#example" ? viewExample() : viewHome();
}
init();
</script>
